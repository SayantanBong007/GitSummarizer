[tool.poetry]
name = "gitsummarize"
version = "0.1.0"
description = "AI Repository Architect — agentic code analysis and documentation generation"
authors = ["GitSummarize Team <team@gitsummarize.ai>"]
readme = "README.md"
packages = [{ include = "backend" }]

[tool.poetry.dependencies]
python = "^3.11"

# Web
fastapi = "^0.115.0"
uvicorn = { extras = ["standard"], version = "^0.30.0" }
pydantic = "^2.8.0"
pydantic-settings = "^2.4.0"
python-multipart = "^0.0.9"
httpx = "^0.27.0"
slowapi = "^0.1.9"

# Database
sqlalchemy = { extras = ["asyncio"], version = "^2.0.36" }
alembic = "^1.13.3"
asyncpg = "^0.29.0"
neo4j = "^5.24.0"
qdrant-client = "^1.11.0"

# Queue / Cache
celery = { extras = ["redis"], version = "^5.4.0" }
flower = "^2.0.0"
redis = { extras = ["hiredis"], version = "^5.1.0" }

# AI / LLM
langchain = "^0.3.0"
langchain-openai = "^0.2.0"
langchain-core = "^0.3.0"
langgraph = "^0.2.0"
torch = {version = ">=2.0.0,<3.0.0", source = "pytorch-cpu"}
sentence-transformers = "^3.1.0"
tiktoken = "^0.7.0"

# Code parsing
tree-sitter = "^0.23.0"
tree-sitter-python = "^0.23.0"
tree-sitter-javascript = "^0.23.0"
tree-sitter-typescript = "^0.23.0"
tree-sitter-java = "^0.23.0"
tree-sitter-go = "^0.23.0"
tree-sitter-rust = "^0.23.0"
tree-sitter-c-sharp = "^0.23.0"
tree-sitter-php = "^0.23.0"

# Git
gitpython = "^3.1.43"

# Export
fpdf2 = "^2.8"
jinja2 = "^3.1.4"

# Observability
structlog = "^24.4.0"
prometheus-fastapi-instrumentator = "^7.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.0"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
anyio = "^4.6.0"
aiosqlite = "^0.20.0"
httpx = "^0.27.0"
factory-boy = "^3.3.1"
respx = "^0.21.1"
ruff = "^0.6.0"
mypy = "^1.11.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=backend --cov-report=term-missing --cov-report=html"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "TID"]
ignore = [
    "B008",  # FastAPI: Depends() in default args is the canonical DI pattern
]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
